version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql_core
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_DATABASE: pipeline_db
      MYSQL_USER: pipeline_user
      MYSQL_PASSWORD: pipeline_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Montamos la carpeta local 'init' dentro del contenedor
      - ./init:/docker-entrypoint-initdb.d 

volumes:
  db_data:
